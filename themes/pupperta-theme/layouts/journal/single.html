{{ define "main" }}
<div class="px-4 lg:px-6 py-8">
  <article class="max-w-3xl">
    <header class="mb-4">
      <h1 class="text-2xl font-semibold">{{ .Title }}</h1>
      <p class="text-sm text-gray-500">Published {{ .Date.Format "Jan 2, 2006" }} · {{ .Params.reading_time }} min read</p>
    </header>
    <img src="{{ .Params.featured_image }}" alt="{{ .Title }}" class="w-full h-auto rounded-lg mb-6" />
    <div class="prose prose-sm max-w-none text-gray-800">
      <p>{{ .Params.story }}</p>
    </div>
  </article>
</div>
{{ end }}
