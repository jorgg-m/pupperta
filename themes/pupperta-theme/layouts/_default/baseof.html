<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ if .Title }}{{ .Title }} — {{ end }}{{ .Site.Title }}</title>
    <!-- Fonts: Inter & DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS overrides -->
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="font-sans antialiased bg-white text-mb-black selection:bg-gray-100 selection:text-black">
    <!-- Off-canvas overlay for mobile sidebar -->
    <div id="sidebar-overlay" class="fixed inset-0 z-40 bg-black/30 opacity-0 pointer-events-none transition-opacity duration-300 ease-in-out lg:hidden" aria-hidden="true"></div>

    <!-- Sidebar -->
    {{ partial "sidebar.html" . }}

    <!-- Main content wrapper: left padding on large screens -->
    <div id="main-content" class="min-h-screen transition-all duration-300 ease-in-out">
      <!-- Top utility bar (mobile) -->
      {{ partial "header.html" . }}

      <!-- Main content -->
      <main>
        {{ block "main" . }}{{ end }}
      </main>
    </div>

    <!-- Fixed sidebar open button (appears when sidebar is closed) -->
    <button id="sidebar-fixed-open" class="fixed left-0 bottom-12 -translate-y-1/2 z-40 inline-flex items-center justify-center h-12 w-6 rounded-r-lg bg-mb-black text-white shadow-lg opacity-0 pointer-events-none transition-all duration-300 ease-in-out" aria-label="Open sidebar">
      <span class="text-sm font-medium">→</span>
    </button>

    <!-- Floating Action Button: Scroll to top -->
    <button id="scrollTopBtn" class="fixed bottom-5 right-5 z-40 inline-flex items-center justify-center h-11 w-11 rounded-full bg-mb-black text-white shadow-lg opacity-0 translate-y-3 pointer-events-none transition-all duration-300 ease-in-out" aria-label="Scroll to top">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
    </button>
    
    <script src="/script.js"></script>
  </body>
</html>
