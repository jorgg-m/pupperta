<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Responsive Masonry Feed</title>
    <!-- Fonts: Inter & DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS overrides -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="font-sans antialiased bg-white text-mb-black selection:bg-gray-100 selection:text-black">
    <!--
      Layout: fixed left sidebar (desktop), off-canvas (mobile)
      Main area includes: sticky classification bar, masonry feed, floating button
    -->

    <!-- Off-canvas overlay for mobile sidebar -->
    <div id="sidebar-overlay" class="fixed inset-0 z-40 bg-black/30 opacity-0 pointer-events-none transition-opacity duration-300 ease-in-out lg:hidden" aria-hidden="true"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 transform -translate-x-full lg:translate-x-0 bg-white border-r border-gray-100 shadow-sm lg:shadow-none transition-transform duration-300 ease-in-out" role="navigation" aria-label="Primary">
      <div class="h-full flex flex-col">
        <div class="flex items-center justify-between px-5 h-16 border-b border-gray-100">
          <div class="flex items-center gap-2">
            <span class="inline-flex h-8 w-8 items-center justify-center rounded-md bg-mb-black text-white text-sm font-semibold">MB</span>
            <span class="text-base font-semibold">Pupperta</span>
          </div>
          <button id="sidebar-close" class="lg:hidden inline-flex items-center justify-center h-9 w-9 rounded-md hover:bg-gray-100 transition-all duration-300 ease-in-out" aria-label="Close sidebar" aria-controls="sidebar" aria-expanded="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <nav class="flex-1 overflow-y-auto px-3 py-4">
          <ul class="space-y-1">
            <li>
              <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-gray-100 transition-all duration-300 ease-in-out" aria-current="page">
                <span class="inline-flex h-6 w-6 items-center justify-center rounded bg-gray-100">🏠</span>
                <span class="text-sm font-medium">Home</span>
              </a>
            </li>
            <li>
              <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-gray-100 transition-all duration-300 ease-in-out">
                <span class="inline-flex h-6 w-6 items-center justify-center rounded bg-gray-100">✨</span>
                <span class="text-sm font-medium">Trending</span>
              </a>
            </li>
            <li>
              <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-gray-100 transition-all duration-300 ease-in-out">
                <span class="inline-flex h-6 w-6 items-center justify-center rounded bg-gray-100">📁</span>
                <span class="text-sm font-medium">Collections</span>
              </a>
            </li>
            <li>
              <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-gray-100 transition-all duration-300 ease-in-out">
                <span class="inline-flex h-6 w-6 items-center justify-center rounded bg-gray-100">⚙️</span>
                <span class="text-sm font-medium">Settings</span>
              </a>
            </li>
          </ul>
        </nav>

        <div class="border-t border-gray-100 px-5 py-3">
          <div class="flex items-center gap-3">
            <img src="https://i.pravatar.cc/40?img=8" alt="User avatar" class="h-8 w-8 rounded-full" />
            <div class="min-w-0">
              <p class="text-sm font-semibold truncate">Alex Developer</p>
              <p class="text-xs text-gray-500 truncate">alex@example.com</p>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main content wrapper: left padding on large screens -->
    <div class="lg:pl-64 min-h-screen">
      <!-- Top utility bar (mobile) -->
      <div class="sticky top-0 z-30 bg-white/80 backdrop-blur supports-[backdrop-filter]:bg-white/60 border-b border-gray-100">
        <div class="h-14 flex items-center justify-between px-4 lg:px-6">
          <button id="sidebar-open" class="lg:hidden inline-flex items-center justify-center h-9 w-9 rounded-md hover:bg-gray-100 transition-all duration-300 ease-in-out" aria-label="Open sidebar" aria-controls="sidebar" aria-expanded="false">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
          </button>

          <form class="flex-1 max-w-lg mx-4" role="search" aria-label="Search images">
            <label for="q" class="sr-only">Search</label>
            <div class="relative">
              <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                <svg class="h-4 w-4 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 103.75 3.75a7.5 7.5 0 0012.9 12.9z"/></svg>
              </div>
              <input id="q" name="q" type="search" class="block w-full rounded-md border border-gray-100 bg-gray-100/60 focus:bg-white focus:border-black/10 focus:ring-0 pl-9 pr-3 py-2 text-sm placeholder:text-gray-500 transition-all duration-300 ease-in-out" placeholder="Search (mocked)" />
            </div>
          </form>

          <div class="hidden sm:flex items-center gap-2">
            <button class="inline-flex items-center gap-2 rounded-md border border-gray-100 px-3 py-2 text-sm font-medium hover:bg-gray-100 transition-all duration-300 ease-in-out" aria-label="Upload (mock)">Upload</button>
          </div>
        </div>
      </div>

      <!-- Sticky classification/tag bar that hides on scroll down, reveals on scroll up -->
      <div id="classify-bar" class="sticky top-14 z-20 bg-white border-b border-gray-100 transition-transform duration-300 ease-in-out">
        <div class="px-4 lg:px-6 py-3 overflow-x-auto">
          <div class="flex items-center gap-2 min-w-max">
            <button class="tag-btn inline-flex items-center rounded-full border border-gray-100 bg-white px-3 py-1.5 text-sm font-medium hover:bg-gray-100 transition-all duration-300 ease-in-out" aria-pressed="true">All</button>
            <button class="tag-btn inline-flex items-center rounded-full border border-gray-100 bg-white px-3 py-1.5 text-sm font-medium hover:bg-gray-100 transition-all duration-300 ease-in-out">Architecture</button>
            <button class="tag-btn inline-flex items-center rounded-full border border-gray-100 bg-white px-3 py-1.5 text-sm font-medium hover:bg-gray-100 transition-all duration-300 ease-in-out">Nature</button>
            <button class="tag-btn inline-flex items-center rounded-full border border-gray-100 bg-white px-3 py-1.5 text-sm font-medium hover:bg-gray-100 transition-all duration-300 ease-in-out">Portraits</button>
            <button class="tag-btn inline-flex items-center rounded-full border border-gray-100 bg-white px-3 py-1.5 text-sm font-medium hover:bg-gray-100 transition-all duration-300 ease-in-out">Abstract</button>
            <button class="tag-btn inline-flex items-center rounded-full border border-gray-100 bg-white px-3 py-1.5 text-sm font-medium hover:bg-gray-100 transition-all duration-300 ease-in-out">Animals</button>
            <button class="tag-btn inline-flex items-center rounded-full border border-gray-100 bg-white px-3 py-1.5 text-sm font-medium hover:bg-gray-100 transition-all duration-300 ease-in-out">Urban</button>
          </div>
        </div>
      </div>

      <!-- Masonry grid feed -->
      <main id="main" class="px-4 lg:px-6 py-6">
        <div id="masonry" class="columns-1 sm:columns-2 lg:columns-3 xl:columns-4 gap-4 [column-fill:_balance]"><!-- items injected by JS --></div>

        <!-- Sentinel for infinite scroll -->
        <div id="sentinel" class="h-12"></div>

        <!-- End-of-content message -->
        <div id="end-message" class="hidden py-10 text-center text-sm text-gray-500">This is all folks!</div>
      </main>
    </div>

    <!-- Floating Action Button: Scroll to top -->
    <button id="scrollTopBtn" class="fixed bottom-5 right-5 z-40 inline-flex items-center justify-center h-11 w-11 rounded-full bg-mb-black text-white shadow-lg opacity-0 translate-y-3 pointer-events-none transition-all duration-300 ease-in-out" aria-label="Scroll to top">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
    </button>
    <script src="script.js"></script>
  </body>
  </html>
